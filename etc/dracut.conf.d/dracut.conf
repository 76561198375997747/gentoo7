uefi="yes"
hostonly="yes"
compress="zstd"
i18n_vars="/usr/share/consolefonts /usr/share/keymaps"

kernel_cmdline="efi=runtime \
                root=PARTUUID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx ro \
                zswap.enabled=1 \
                zswap.compressor=zstd \
                zswap.max_pool_percent=20 \
                zswap.accept_threshold_percent=80 \
                zswap.shrinker_enabled=1 \
                acpi_backlight=nvidia_wmi_ec \
                quiet splash"

add_dracutmodules+=" dm kernel-modules lvm \
                     modsign rescue rootfs-block \
                     securityfs systemd udev-rules "

install_items+=" /usr/sbin/xfs_admin /usr/bin/expr "

omit_drivers+=" nvidia nvidia-drm nvidia-modeset nvidia-uvm "

# new method without initram-fs/disk (efistub compatible), see /etc/portage/make.conf
# explicit microcode loading enablement
# early_microcode="yes"